        /* ── 画布性能优化 ── */
        /* 1. 视口 GPU 加速：让缩放/平移走合成线程，不触发重排 */
        .laowu-canvas-viewport {
            will-change: transform;
            transform: translateZ(0);
            backface-visibility: hidden;
        }

        /* 2. 节点隔离：限制每个节点的布局/绘制影响范围 */
        [data-node-id] {
            contain: layout style;
        }

        .canvas-node-layer {
            position: absolute;
            left: 0;
            top: 0;
            width: 0;
            height: 0;
            z-index: 1;
            isolation: isolate;
        }

        .canvas-connection-layer {
            isolation: isolate;
        }

        /* 3. 图片异步解码 + 渲染优化 */
        .laowu-canvas-viewport img {
            image-rendering: auto;
            /* 减少大面积图片的绘制开销 */
            will-change: transform;
        }

        /* 生成面板也加 GPU 层 */
        [data-canvas-resize-ready] {
            will-change: transform;
        }
