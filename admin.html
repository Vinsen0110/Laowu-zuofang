<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>老屋作坊 · 管理后台</title>
<link rel="icon" type="image/png" href="./kitty.png">
<script src="./avatar.js?v=20261022-avatar-01"></script>
<style>
:root{
  --bg:#f7f7f8;--panel:#fff;--text:#18181b;--text-2:#3f3f46;--muted:#71717a;--faint:#a1a1aa;
  --border:#e4e4e7;--border-2:#efeff1;--soft:#f4f4f5;--hover:#fafafa;
  --primary:#1f7a55;--primary-h:#196647;--primary-soft:rgb(31 122 85 / .09);
  --danger:#c2410c;--danger-soft:#fff4ed;--danger-line:#fed7aa;
  --radius:10px;--shadow:0 1px 2px rgb(24 24 27 / .04),0 1px 1px rgb(24 24 27 / .02);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0d0d0f;--panel:#151518;--text:#f4f4f5;--text-2:#d4d4d8;--muted:#a1a1aa;--faint:#71717a;
  --border:#27272a;--border-2:#1f1f23;--soft:#1c1c20;--hover:#18181c;
  --primary:#34a874;--primary-h:#46b984;--primary-soft:rgb(52 168 116 / .12);
  --danger:#fb923c;--danger-soft:#2a1709;--danger-line:#7c2d12;--shadow:none;
}}
*{box-sizing:border-box}
html{-webkit-font-smoothing:antialiased}
body{margin:0;background:var(--bg);color:var(--text);font:13.5px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:-.003em}
a{color:inherit}
.muted{color:var(--muted)}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

/* shell */
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px;padding:16px 12px;border-right:1px solid var(--border);background:var(--panel)}
.brand{display:flex;align-items:center;gap:9px;padding:4px 8px 16px;font-weight:600;font-size:14px}
.brand img{width:26px;height:26px}
.brand small{display:block;color:var(--muted);font-weight:400;font-size:11.5px;line-height:1.2}
.nav{display:flex;align-items:center;gap:9px;height:32px;padding:0 9px;border-radius:7px;color:var(--text-2);font-weight:500;text-decoration:none;transition:background .1s,color .1s}
.nav:hover{background:var(--soft);color:var(--text)}
.nav.is-on{background:var(--soft);color:var(--text);box-shadow:inset 0 0 0 1px var(--border)}
.nav svg{flex:0 0 auto;color:var(--muted)}
.nav.is-on svg{color:var(--primary)}
.nav .count{margin-left:auto;color:var(--faint);font-size:11.5px;font-variant-numeric:tabular-nums}
.nav .dot{margin-left:auto;width:7px;height:7px;border-radius:50%;background:var(--danger)}
.side-foot{margin-top:auto;display:flex;align-items:center;gap:9px;padding:10px 8px 2px;border-top:1px solid var(--border-2)}
.side-foot img{width:28px;height:28px;border-radius:50%}
.side-foot .who{min-width:0;font-size:12px;line-height:1.3}
.side-foot .who b{display:block;overflow:hidden;font-weight:600;text-overflow:ellipsis;white-space:nowrap}
.side-foot .who a{color:var(--muted);text-decoration:none}
.side-foot .who a:hover{color:var(--text)}
.main{min-width:0;padding:28px 36px 64px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px}
.page-head h1{margin:0;font-size:20px;font-weight:600;letter-spacing:-.015em}
.page-head p{margin:4px 0 0;color:var(--muted);font-size:13px}
.page{max-width:none}

/* panels */
.card{margin-bottom:16px;border:1px solid var(--border);border-radius:var(--radius);background:var(--panel);box-shadow:var(--shadow)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border-2)}
.card-head h2{margin:0;font-size:14px;font-weight:600}
.card-head .sub{margin-left:8px;color:var(--muted);font-size:12.5px;font-weight:400}
.card-body{padding:16px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* kpis */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:16px;border:1px solid var(--border);border-radius:var(--radius);background:var(--panel);box-shadow:var(--shadow);overflow:hidden}
.stat{padding:14px 16px;border-left:1px solid var(--border-2)}
.stat:first-child{border-left:0}
.stat span{color:var(--muted);font-size:12px}
.stat b{display:block;margin-top:4px;font-size:22px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}

/* controls */
input,select{height:32px;padding:0 10px;border:1px solid var(--border);border-radius:7px;background:var(--panel);color:var(--text);font:inherit;transition:border-color .12s,box-shadow .12s}
input::placeholder{color:var(--faint)}
input:focus,select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
input:disabled{background:var(--soft);color:var(--muted)}
button{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border:1px solid transparent;border-radius:7px;background:var(--text);color:var(--panel);font:inherit;font-weight:500;font-size:13px;white-space:nowrap;cursor:pointer;transition:background .12s,border-color .12s,opacity .12s}
button:hover{opacity:.88}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--primary);color:#fff}
button.primary:hover{background:var(--primary-h);opacity:1}
button.ghost{background:var(--panel);color:var(--text);border-color:var(--border)}
button.ghost:hover{background:var(--soft);opacity:1}
button.quiet{background:transparent;color:var(--muted)}
button.quiet:hover{background:var(--soft);color:var(--text);opacity:1}
button.danger{background:transparent;color:var(--danger);border-color:transparent}
button.danger:hover{background:var(--danger-soft);opacity:1}
button.small{height:28px;padding:0 9px;font-size:12.5px}
label.field{display:flex;flex-direction:column;gap:5px;color:var(--muted);font-size:12px;font-weight:500}

/* tables */
.table-box{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px 16px;border-top:1px solid var(--border-2);text-align:left;white-space:nowrap;vertical-align:middle}
thead th{border-top:0;color:var(--muted);font-weight:500;font-size:12px;background:var(--panel)}
tbody tr:hover td{background:var(--hover)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tag{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:5px;background:var(--soft);color:var(--muted);font-size:11.5px;font-weight:500}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.7}
.tag.ok{background:var(--primary-soft);color:var(--primary)}
.tag.off{background:var(--danger-soft);color:var(--danger)}
.tag.plain::before{display:none}
.msg{margin:12px 16px 0;padding:8px 12px;border-radius:7px;font-size:12.5px}
.card-body .msg{margin:12px 0 0}
.msg:last-child{margin-bottom:16px}
.card-body .msg:last-child{margin-bottom:0}
.msg.err{background:var(--danger-soft);color:var(--danger)}
.msg.ok{background:var(--primary-soft);color:var(--primary)}
textarea{width:100%;min-height:150px;margin-top:10px;padding:10px 12px;border:1px solid var(--border);border-radius:7px;background:var(--soft);color:var(--text);font:12.5px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace}
.gate{max-width:380px;margin:16vh auto;padding:28px;text-align:center}
.gate h1{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 0 6px;font-size:18px}
.gate h1 img{width:30px;height:30px}
.gate a{color:var(--primary)}
dialog{width:min(600px,calc(100vw - 32px));padding:0;border:1px solid var(--border);border-radius:12px;background:var(--panel);color:var(--text);box-shadow:0 24px 64px rgb(0 0 0 / .18)}
dialog::backdrop{background:rgb(9 9 11 / .4);backdrop-filter:blur(2px)}
.alert{display:flex;align-items:center;gap:10px;padding:10px 14px;margin-bottom:16px;border:1px solid var(--danger-line);border-radius:var(--radius);background:var(--danger-soft);color:var(--danger);font-weight:500}

/* channels */
.channels{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.ch{display:flex;flex-direction:column;gap:12px;padding:14px;border:1px solid var(--border);border-radius:var(--radius);background:var(--panel)}
.ch.is-low{border-color:var(--danger-line);background:linear-gradient(var(--danger-soft),var(--panel) 60%)}
.ch-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ch-name{font-weight:600}
.ch-label{margin-left:6px;color:var(--muted);font-size:12px;font-weight:400}
.ch-bal-row{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.ch-bal{font-size:22px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.ch-topup{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 9px;border:1px solid var(--border);border-radius:6px;font-size:12px;font-weight:500;text-decoration:none;white-space:nowrap}
.ch-topup:hover{background:var(--soft)}
.ch.is-low .ch-topup{border-color:var(--danger);background:var(--danger);color:#fff}
.ch-sub{margin-top:-6px;color:var(--muted);font-size:12px;min-height:16px}
.ch form{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--border-2)}
.ch input{width:100%}
.ch-save{display:flex;gap:8px;align-items:flex-end}
.ch-save label{flex:1}

/* price table */
.pt-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border-2)}
.pt-tools .grow{flex:1}
.pt-site{border-top:1px solid var(--border-2)}
.pt-site:first-of-type{border-top:0}
.pt-site>summary{display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer;list-style:none;user-select:none}
.pt-site>summary::-webkit-details-marker{display:none}
.pt-site>summary:hover{background:var(--hover)}
.pt-site>summary .chev{color:var(--faint);transition:transform .15s}
.pt-site[open]>summary .chev{transform:rotate(90deg)}
.pt-site>summary b{font-weight:600}
.pt-site>summary .meta{color:var(--muted);font-size:12px}
.pt-site>summary .bar{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.pt-site>summary .bar i{display:block;width:72px;height:4px;border-radius:2px;background:var(--soft);overflow:hidden}
.pt-site>summary .bar i::after{content:"";display:block;height:100%;width:var(--p);background:var(--primary)}
.pt-site>summary .dirty{color:var(--primary);font-weight:500}
.pt-site .table-box{border-top:1px solid var(--border-2)}
.pt td{vertical-align:middle}
.pt .cost-col{color:var(--muted);font-variant-numeric:tabular-nums}
.pt th.cost-head,.pt th.price-head{text-align:center}
.pt th.price-head{color:var(--primary)}
.pt td:nth-child(2),.pt td:nth-child(5),.pt th.cost-head,.pt th.price-head,.pt tr:nth-child(2) th:nth-child(1),.pt tr:nth-child(2) th:nth-child(4){border-left:1px solid var(--border-2)}
.pt input{width:84px;height:28px;padding:0 8px;text-align:right;font-variant-numeric:tabular-nums}
.pt input.is-dirty{border-color:var(--primary);background:var(--primary-soft)}
.pt .label{font-weight:500}
.pt .key{display:block;color:var(--faint);font-size:11px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

/* users */
.user{display:flex;align-items:center;gap:10px;min-width:0}
.user img{flex:0 0 auto;width:30px;height:30px;border-radius:50%;object-fit:cover}
.user .nm{font-weight:500}
.user .em{color:var(--muted);font-size:12px}
.acts{display:flex;justify-content:flex-end;gap:2px}
tr.adjust-row td{background:var(--hover)}
tr.adjust-row form{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.search{position:relative}
.search svg{position:absolute;left:9px;top:50%;translate:0 -50%;color:var(--faint)}
.search input{width:240px;padding-left:30px}

@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;border-right:0;border-bottom:1px solid var(--border)}
  .brand{padding:4px 8px}
  .side-foot{display:none}
  .main{padding:20px 16px 48px}
  .stat{border-left:0;border-top:1px solid var(--border-2)}
}
</style>
</head>
<body>
<div id="app"><p class="muted" style="padding:28px">加载中…</p></div>

<dialog id="ledger-dialog">
  <div class="card-head"><h2 id="ledger-title">余额记录</h2><button class="quiet small" type="button" onclick="this.closest('dialog').close()">关闭</button></div>
  <div class="table-box" style="max-height:60vh"><table><thead><tr><th>时间</th><th>说明</th><th class="num">变动</th><th class="num">余额</th></tr></thead><tbody id="ledger-body"></tbody></table></div>
</dialog>

<script>
(function () {
  "use strict";
  const app = document.getElementById("app");
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const money = (n) => "¥" + (Math.round(Number(n) * 1000) % 10 ? Number(n).toFixed(3) : Number(n).toFixed(2));
  const time = (t) => t ? new Date(t).toLocaleString("zh-CN", { hour12: false }) : "";
  const KIND = { redeem: "兑换码", admin: "管理员调整", usage: "生成消费", refund: "失败退款" };

  async function api(path, body, method) {
    const res = await fetch("/api/account" + path, {
      method: method || (body ? "POST" : "GET"),
      credentials: "same-origin",
      headers: body ? { "Content-Type": "application/json" } : undefined,
      body: body ? JSON.stringify(body) : undefined,
    });
    let data = {};
    try { data = await res.json(); } catch (_) {}
    if (!res.ok) throw new Error(data?.error?.message || "请求失败（" + res.status + "）");
    return data;
  }

  let me = null;
  let users = [];
  let codes = [];
  let lastBatch = null;
  let flash = { users: null, codes: null, channels: null, prices: null };
  let channels = [];
  let balances = null;
  let balancesLoading = false;
  let prices = [];
  let catalog = [];
  let cloud = { cloudName: "", apiKey: "", apiSecret: "" };
  let cos = { bucket: "", region: "ap-guangzhou", secretId: "", hasSecret: false, ready: false };
  let mail = { hasKey: false, keyPreview: "", fromEnv: false };
  let fx = 6.7;
  let markup = 2;
  const draft = new Map(); // "channel|model|spec" -> price string being edited
  const TABS = ["overview", "prices", "users", "codes", "settings"];
  let tab = TABS.includes(location.hash.slice(1)) ? location.hash.slice(1) : "overview";
  const openSites = new Set(["tudou"]); // price-table groups left open
  let adjustUser = null; // user id whose balance form is open
  let userQ = "";
  const userQuery = () => (document.getElementById("user-q")?.value ?? userQ).trim();
  window.addEventListener("hashchange", () => {
    const next = location.hash.slice(1);
    if (TABS.includes(next) && next !== tab) { tab = next; render(); window.scrollTo(0, 0); }
  });

  function msg(m) { return m ? `<div class="msg ${m.err ? "err" : "ok"}" role="${m.err ? "alert" : "status"}">${esc(m.text)}</div>` : ""; }

  async function load() {
    me = (await api("/me")).user;
    if (!me || me.role !== "admin") {
      app.innerHTML = `<div class="gate card"><h1><img src="./kitty.png" alt="">管理后台</h1>
        <p class="muted">${me ? "当前账号没有管理员权限。" : "请先在老屋作坊首页登录管理员账号。"}</p>
        <p><a href="/">返回老屋作坊</a></p></div>`;
      return;
    }
    await Promise.all([loadStats(), loadUsers(), loadCodes(), loadChannels(), loadPrices(), loadCloud(), loadCos(), loadMail()]);
    render();
    checkBalances();
  }

  let statsData = null;
  async function loadStats() { statsData = await api("/admin/stats"); }
  async function loadUsers(q) { users = (await api("/admin/users" + (q ? "?q=" + encodeURIComponent(q) : ""))).items; }
  async function loadCodes() { codes = (await api("/admin/codes")).items; }
  async function loadCloud() { cloud = await api("/admin/cloudinary"); }
  async function loadCos() { cos = await api("/admin/cos"); }
  async function loadMail() { mail = await api("/admin/mail"); }
  async function loadChannels() { channels = (await api("/admin/channels")).items; }
  async function loadPrices() {
    const r = await api("/admin/price-catalog");
    catalog = r.rows; prices = r.prices; fx = r.fx;
  }
  const priceKey = (r) => `${r.channel}|${r.model}|${r.spec}`;
  const savedPrice = (r) => prices.find((p) => priceKey(p) === priceKey(r));
  async function checkBalances() {
    balancesLoading = true; render();
    try { balances = await api("/admin/channel-balances"); flash.channels = null; }
    catch (err) { flash.channels = { err: true, text: err.message }; }
    balancesLoading = false; render();
  }
  const fmtBal = (b, unit) => b == null ? "--" : b < 0 ? "无限" : unit + Number(b).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  const SITE_ORDER = ["tudou", "apimart", "runninghub", "grsai", "soon"];
  const SITE_NAME = { tudou: "Tudou", apimart: "Mart", runninghub: "RH", grsai: "Grsai", soon: "Soon" };
  const CHANNEL_NAME = { tudou: "渠道 1", apimart: "渠道 2", grsai: "渠道 3", runninghub: "渠道 4", soon: "渠道 5" };
  const svg = (d, size = 16) => `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
  const ICON = {
    overview: svg('<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>'),
    prices: svg('<path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8Z"/><circle cx="7.5" cy="7.5" r="1.5"/>'),
    users: svg('<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9"/><path d="M16 3.1a4 4 0 0 1 0 7.8"/>'),
    codes: svg('<path d="M3 9a3 3 0 0 0 0 6v3a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1v-3a3 3 0 0 0 0-6V6a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1Z"/><path d="M13 5v2M13 17v2M13 11v2"/>'),
    settings: svg('<path d="M12.2 2h-.4a2 2 0 0 0-2 2v.2a2 2 0 0 1-1 1.7l-.4.3a2 2 0 0 1-2 0l-.2-.1a2 2 0 0 0-2.7.7l-.2.4a2 2 0 0 0 .7 2.7l.2.1a2 2 0 0 1 1 1.7v.6a2 2 0 0 1-1 1.7l-.2.1a2 2 0 0 0-.7 2.7l.2.4a2 2 0 0 0 2.7.7l.2-.1a2 2 0 0 1 2 0l.4.3a2 2 0 0 1 1 1.7v.2a2 2 0 0 0 2 2h.4a2 2 0 0 0 2-2v-.2a2 2 0 0 1 1-1.7l.4-.3a2 2 0 0 1 2 0l.2.1a2 2 0 0 0 2.7-.7l.2-.4a2 2 0 0 0-.7-2.7l-.2-.1a2 2 0 0 1-1-1.7v-.6a2 2 0 0 1 1-1.7l.2-.1a2 2 0 0 0 .7-2.7l-.2-.4a2 2 0 0 0-2.7-.7l-.2.1a2 2 0 0 1-2 0l-.4-.3a2 2 0 0 1-1-1.7V4a2 2 0 0 0-2-2Z"/><circle cx="12" cy="12" r="3"/>'),
    chev: svg('<path d="m9 18 6-6-6-6"/>', 14).replace("<svg", '<svg class="chev"'),
    search: svg('<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>', 14),
    ext: svg('<path d="M7 17 17 7"/><path d="M8 7h9v9"/>', 12),
  };
  const avatarOf = (u) => (typeof lwAvatarUrl === "function" ? lwAvatarUrl({ ...u, email: u.email || u.username }) : "");

  function priceTables() {
    const costCell = (r) => r
      ? `<td class="num cost-col">${r.cost == null ? `<span class="muted">${esc(r.costText)}</span>` : money(r.cost)}${r.costText.startsWith("$") ? `<span class="key">${esc(r.costText)}</span>` : ""}</td>`
      : `<td class="num cost-col muted">—</td>`;
    const priceCell = (r) => {
      if (!r) return `<td class="muted">—</td>`;
      const key = priceKey(r);
      const saved = savedPrice(r);
      const value = draft.has(key) ? draft.get(key) : saved ? String(saved.price) : "";
      return `<td><input type="number" step="0.001" min="0" placeholder="客户价" aria-label="${esc(SITE_NAME[r.channel] + " " + r.label + " " + r.spec)} 客户价" data-price-key="${esc(key)}" value="${esc(value)}" class="${draft.has(key) ? "is-dirty" : ""}"></td>`;
    };
    return SITE_ORDER.map((ch) => {
      const rows = catalog.filter((r) => r.channel === ch);
      if (!rows.length) return "";
      const labels = [...new Set(rows.map((r) => r.label))];
      const priced = rows.filter((r) => { const k = priceKey(r); return draft.has(k) ? draft.get(k).trim() !== "" : Boolean(savedPrice(r)); }).length;
      const dirty = rows.filter((r) => draft.has(priceKey(r))).length;
      const pct = Math.round((priced / rows.length) * 100);
      return `<details class="pt-site" data-site="${ch}" ${openSites.has(ch) ? "open" : ""}>
        <summary>${ICON.chev}<b>${esc(SITE_NAME[ch])}</b><span class="meta">${esc(CHANNEL_NAME[ch] || "")} · ${labels.length} 个模型</span>
          <span class="bar">${dirty ? `<span class="dirty">${dirty} 处未保存</span>` : ""}已定价 ${priced}/${rows.length}<i style="--p:${pct}%"></i></span></summary>
        <div class="table-box"><table class="pt">
        <thead>
          <tr><th rowspan="2">模型</th><th colspan="3" class="cost-head">原价（元/张）</th><th colspan="3" class="price-head">客户价（元/张）</th></tr>
          <tr><th class="num">1K</th><th class="num">2K</th><th class="num">4K</th><th>1K</th><th>2K</th><th>4K</th></tr>
        </thead>
        <tbody>${labels.map((label) => {
          const items = rows.filter((r) => r.label === label);
          const single = items.length === 1 && !items[0].spec;
          const byRes = (res) => single ? (res === "1k" ? items[0] : null) : items.find((r) => r.spec.split("/")[0] === res);
          const res = ["1k", "2k", "4k"];
          return `<tr><td><span class="label">${esc(label)}</span><span class="key">${esc(items[0].model)}${single ? " · 不分分辨率" : ""}</span></td>
            ${res.map((x) => costCell(byRes(x))).join("")}${res.map((x) => priceCell(byRes(x))).join("")}</tr>`;
        }).join("")}</tbody></table></div></details>`;
    }).join("") + extraPrices();
  }

  // Prices saved earlier that are not in the built-in catalog.
  function extraPrices() {
    const known = new Set(catalog.map(priceKey));
    const extra = prices.filter((p) => !known.has(priceKey(p)));

    return `<details class="pt-site" open><summary>${ICON.chev}<b>其他已保存的价格</b><span class="meta">不在内置模型列表里</span></summary><div class="table-box"><table>

  app.addEventListener("submit", async (e) => {
    const form = e.target;
    e.preventDefault();
    try {
      if (form.id === "search-form") {
        userQ = form.querySelector("#user-q").value.trim();
        await loadUsers(userQ);
        flash.users = null;
      } else if (form.dataset.adjust) {
        const amount = form.amount.value.trim();
        if (!amount || Number(amount) === 0) throw new Error("请输入金额");
        const u = users.find((x) => x.id === Number(form.dataset.adjust));
        if (!confirm(`确认给 ${u.username} ${Number(amount) > 0 ? "充值" : "扣减"} ${money(Math.abs(Number(amount)))}？`)) return;
        const r = await api("/admin/balance", { userId: u.id, amountYuan: amount, note: form.note.value.trim() });
        flash.users = { text: `${u.username} 当前余额 ${money(r.balance)}` };
        adjustUser = null;
        await Promise.all([loadUsers(userQuery()), loadStats()]);
      } else if (form.dataset.channel) {
        const data = Object.fromEntries(new FormData(form).entries());
        const body = { id: form.dataset.channel, alertThreshold: data.alertThreshold };
        if (data.apiKey) body.apiKey = data.apiKey;
        if (data.apiKey2) body.apiKey2 = data.apiKey2;
        await api("/admin/channels", body);
        flash.channels = { text: "已保存" };
        await loadChannels();
        checkBalances();

      } else if (form.id === "mail-form") {
        const key = new FormData(form).get("apiKey");
        if (!key) throw new Error("请粘贴 Resend API Key");
        mail = await api("/admin/mail", { apiKey: key });
        flash.mail = { text: "已保存，之后的验证码会通过邮件发送" };
      } else if (form.id === "cos-form") {
        const data = Object.fromEntries(new FormData(form).entries());
        cos = await api("/admin/cos", data);
        flash.cos = { text: cos.ready ? "已保存，点「测试上传」确认能用" : "已保存，还差几项没填" };
      } else if (form.id === "cloud-form") {
        const data = Object.fromEntries(new FormData(form).entries());
        cloud = await api("/admin/cloudinary", data);
        flash.cloud = { text: "已保存，管理员账号刷新画布后生效" };
      } else if (form.id === "codes-form") {
        const data = Object.fromEntries(new FormData(form).entries());
        lastBatch = await api("/admin/codes", data);
        flash.codes = { text: "生成成功" };
        await Promise.all([loadCodes(), loadStats()]);
      }
    } catch (err) {
      if (form.id === "codes-form") flash.codes = { err: true, text: err.message };
      else if (form.id === "cloud-form") flash.cloud = { err: true, text: err.message };
      else if (form.id === "cos-form") flash.cos = { err: true, text: err.message };
      else if (form.id === "mail-form") flash.mail = { err: true, text: err.message };
      else if (form.dataset.channel) flash.channels = { err: true, text: err.message };
      else flash.users = { err: true, text: err.message };
    }
    render();
  });

  app.addEventListener("input", (e) => {
    const input = e.target.closest("[data-price-key]");
    if (!input) return;
    const key = input.dataset.priceKey;
    const r = catalog.find((x) => priceKey(x) === key);
    const saved = r && savedPrice(r);
    if ((saved ? String(saved.price) : "") === input.value.trim()) draft.delete(key);
    else draft.set(key, input.value);
    input.classList.toggle("is-dirty", draft.has(key));
    const save = document.getElementById("pt-save");
    if (save) save.textContent = "保存价格表" + (draft.size ? `（${draft.size} 处修改）` : "");
  });

  app.addEventListener("toggle", (e) => {
    const site = e.target.dataset?.site;
    if (!site) return;
    if (e.target.open) openSites.add(site); else openSites.delete(site);
  }, true);

  app.addEventListener("click", async (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    try {
      if (b.dataset.adjustOpen) {
        const id = Number(b.dataset.adjustOpen);
        adjustUser = adjustUser === id ? null : id;
        render();
        document.querySelector(`[data-adjust="${id}"] input[name="amount"]`)?.focus();
        return;
      }
      if (b.id === "check-balances") { checkBalances(); return; }
      if (b.id === "pt-fill") {
        markup = Number(document.getElementById("pt-markup").value) || markup;
        let n = 0;
        for (const r of catalog) {
          const key = priceKey(r);
          if (r.cost == null || savedPrice(r) || (draft.get(key) ?? "") !== "") continue;
          draft.set(key, String(Math.ceil(r.cost * markup * 100) / 100));
          n++;
        }
        flash.prices = { text: n ? `已填入 ${n} 个客户价（按量计费的规格没有原价，需要手动填），确认后点"保存价格表"` : "没有需要填的空白客户价" };
        render(); return;
      }
      if (b.id === "pt-save") {
        if (!draft.size) { flash.prices = { text: "没有修改" }; render(); return; }
        const items = [...draft.entries()].map(([key, price]) => {
          const [channel, model, spec] = key.split("|");
          const r = catalog.find((x) => priceKey(x) === key);
          return { channel, model, spec, price: price.trim(), cost: r?.costText || "", note: r?.label || "" };
        });
        await api("/admin/prices/bulk", { items });
        draft.clear();
        await loadPrices();
        flash.prices = { text: `已保存 ${items.length} 处修改` };
        render(); return;
      }
      if (b.dataset.delPrice) {
        const r = prices.find((x) => x.id === Number(b.dataset.delPrice));
        if (!confirm(`删除 ${r.model} ${r.spec} 的价格？`)) return;
        await api("/admin/prices/delete", { id: r.id });
        await loadPrices(); render(); return;
      }
      if (b.dataset.ledger) {
        const items = (await api("/admin/user-ledger?userId=" + b.dataset.ledger)).items;
        document.getElementById("ledger-title").textContent = b.dataset.name + " 的余额记录";
        document.getElementById("ledger-body").innerHTML = items.map((i) => `<tr><td>${esc(time(i.createdAt))}</td><td>${esc(i.note || KIND[i.kind] || i.kind)}</td><td class="num">${i.amount > 0 ? "+" : ""}${money(i.amount).replace("¥-", "-¥")}</td><td class="num">${money(i.balanceAfter)}</td></tr>`).join("") || `<tr><td colspan="4" class="muted">没有记录</td></tr>`;
        document.getElementById("ledger-dialog").showModal();
      } else if (b.dataset.disable) {
        const to = b.dataset.to === "true";
        if (to && !confirm("停用后该用户会被立即退出且无法登录，确认？")) return;
        await api("/admin/disable", { userId: Number(b.dataset.disable), disabled: to });
        await loadUsers(userQuery());
        render();
      } else if (b.id === "renumber-users") {
        if (!confirm("把所有用户按注册先后重新编号成 1、2、3…？\n余额、余额记录、兑换码使用记录、登录状态都会跟着新编号，用户不会被退出。")) return;
        const r = await api("/admin/renumber-users", {});
        flash.users = { text: `已重新编号 ${r.users} 个用户` };
        await Promise.all([loadUsers(userQuery()), loadStats()]);
        render();
      } else if (b.dataset.zero) {
        const u = users.find((x) => x.id === Number(b.dataset.zero));
        if (!confirm(`把 ${u.username} 的余额 ${money(u.balance)} 清零？会记入余额记录。`)) return;
        const r = await api("/admin/balance", { userId: u.id, amountYuan: -u.balance, note: "管理员清零" });
        flash.users = { text: `${u.username} 余额已清零（当前 ${money(r.balance)}）` };
        await Promise.all([loadUsers(userQuery()), loadStats()]);
        render();
      } else if (b.dataset.deleteUser) {
        const u = users.find((x) => x.id === Number(b.dataset.deleteUser));
        if (!confirm(`永久删除 ${u.username}？该账号的登录和余额记录会一起删除，无法恢复。`)) return;
        await api("/admin/delete-user", { userId: u.id });
        flash.users = { text: `已删除 ${u.username}` };
        await Promise.all([loadUsers(userQuery()), loadStats()]);
        render();
      } else if (b.dataset.deleteCode) {
        const c = codes.find((x) => x.code === b.dataset.deleteCode);
        if (!confirm(c.usedAt
          ? `删除已使用的兑换码 ${c.code}（${money(c.amount)}）？只删除这条记录，用户已到账的余额和余额记录不受影响。`
          : `删除兑换码 ${c.code}（${money(c.amount)}）？删除后这个码就不能再兑换了。`)) return;
        await api("/admin/delete-code", { code: c.code });
        if (lastBatch) lastBatch.codes = lastBatch.codes.filter((x) => x !== c.code);
        flash.codes = { text: `已删除兑换码 ${c.code}` };
        await loadCodes();
        render();
      } else if (b.id === "cos-test") {
        b.disabled = true;
        b.textContent = "测试中…";
        try {
          await api("/admin/cos/test", {});
          flash.cos = { text: "测试成功：能上传，也能从公开链接读取" };
        } catch (err) {
          flash.cos = { err: true, text: err.message };
        }
        render();
      } else if (b.id === "copy-codes") {
        await navigator.clipboard.writeText(lastBatch.codes.join("\n"));
        b.textContent = "已复制";
      } else if (b.id === "dl-codes") {
        const csv = "兑换码,面额,批次\n" + lastBatch.codes.map((c) => `${c},${lastBatch.amount},${lastBatch.batch}`).join("\n");
        const a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv" }));
        a.download = `兑换码-${lastBatch.amount}元-${lastBatch.codes.length}个.csv`;
        a.click();
      }
    } catch (err) {
      if (b.id && b.id.startsWith("pt-") || b.dataset.delPrice) flash.prices = { err: true, text: err.message };
      else if (b.dataset.deleteCode) flash.codes = { err: true, text: err.message };
      else flash.users = { err: true, text: err.message };
      render();
    }
  });

  load().catch((err) => { app.innerHTML = `<div class="gate card"><p class="msg err">${esc(err.message)}</p></div>`; });
})();
</script>
</body>
</html>
