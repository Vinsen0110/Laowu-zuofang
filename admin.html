<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>老屋作坊 · 管理后台</title>
<link rel="icon" type="image/png" href="./kitty.png">
<style>
:root{--bg:#f8fafc;--card:#fff;--text:#1f2937;--muted:#64748b;--border:#e2e8f0;--soft:#f1f5f9;--primary:#22795a;--primary-h:#1b604a;--danger:#b91c1c;--danger-bg:#fef2f2}
@media (prefers-color-scheme:dark){:root{--bg:#11151c;--card:#1a1f29;--text:#f1f5f9;--muted:#94a3b8;--border:#2c3442;--soft:#222937;--primary:#26875f;--primary-h:#2e9a6d;--danger:#fca5a5;--danger-bg:#3b0d0d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
.wrap{max-width:1120px;margin:0 auto;padding:24px 16px 64px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
h1{display:flex;align-items:center;gap:10px;margin:0;font-size:22px}
h1 img{width:36px;height:36px}
h2{margin:0 0 12px;font-size:16px}
.muted{color:var(--muted)}
.card{padding:18px;margin-bottom:16px;border:1px solid var(--border);border-radius:14px;background:var(--card)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.stat{padding:14px 16px;border:1px solid var(--border);border-radius:12px;background:var(--card)}
.stat b{display:block;margin-top:2px;font-size:24px;font-variant-numeric:tabular-nums}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input,select{height:36px;padding:0 10px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font:inherit}
input:focus{outline:2px solid rgb(34 121 90 / .35);border-color:var(--primary)}
button{height:36px;padding:0 14px;border:0;border-radius:8px;background:var(--primary);color:#fff;font-weight:600;font-size:13px;font-family:inherit;cursor:pointer}
button:hover{background:var(--primary-h)}
button.ghost{background:transparent;color:var(--text);border:1px solid var(--border)}
button.ghost:hover{background:var(--soft)}
button.danger{background:transparent;color:var(--danger);border:1px solid var(--border)}
button.small{height:30px;padding:0 10px;font-size:12px}
.table-box{overflow-x:auto;border:1px solid var(--border);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 12px;border-top:1px solid var(--border);text-align:left;white-space:nowrap}
thead th{border-top:0;background:var(--soft);color:var(--muted);font-weight:600;font-size:12px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;background:var(--soft);color:var(--muted);font-size:12px}
.tag.ok{background:rgb(34 121 90 / .14);color:var(--primary)}
.tag.off{background:var(--danger-bg);color:var(--danger)}
.msg{margin-top:10px;padding:8px 12px;border-radius:8px;font-size:13px}
.msg.err{background:var(--danger-bg);color:var(--danger)}
.msg.ok{background:rgb(34 121 90 / .12);color:var(--primary)}
textarea{width:100%;min-height:140px;margin-top:10px;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--soft);color:var(--text);font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace}
.gate{max-width:420px;margin:12vh auto;text-align:center}
.gate a{color:var(--primary)}
dialog{width:min(560px,calc(100vw - 32px));padding:20px;border:1px solid var(--border);border-radius:14px;background:var(--card);color:var(--text)}
dialog::backdrop{background:rgb(15 23 42 / .45)}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;margin-bottom:16px;border-radius:12px;background:var(--danger-bg);color:var(--danger);font-weight:600}
.channels{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.ch{display:flex;flex-direction:column;gap:10px;padding:14px;border:1px solid var(--border);border-radius:12px;background:var(--card)}
.ch.is-low{border-color:var(--danger);box-shadow:0 0 0 3px var(--danger-bg)}
.ch-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ch-name{font-weight:700}
.ch-label{margin-left:4px;padding:1px 7px;border-radius:999px;background:var(--soft);color:var(--muted);font-size:12px;font-weight:600}
.ch-bal-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ch-bal{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.ch-topup{display:inline-flex;align-items:center;height:30px;padding:0 12px;border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:12px;font-weight:600;text-decoration:none;white-space:nowrap}
.ch-topup:hover{background:var(--soft)}
.ch.is-low .ch-topup{border-color:var(--danger);background:var(--danger);color:#fff}
.ch-sub{color:var(--muted);font-size:12px;min-height:16px}
.ch form{display:flex;flex-direction:column;gap:6px;padding-top:8px;border-top:1px dashed var(--border)}
.ch label{display:flex;flex-direction:column;gap:3px;color:var(--muted);font-size:12px}
.ch input{width:100%}
.ch .row label input{flex:none;width:100%}
.pt-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.pt-group{margin-top:14px}
.pt-group h3{margin:0 0 8px;font-size:14px}
.pt td{vertical-align:top}
.pt .cost-col{color:var(--muted);font-variant-numeric:tabular-nums}
.pt th.cost-head{text-align:center;border-left:1px solid var(--border)}
.pt th.price-head{text-align:center;border-left:1px solid var(--border);color:var(--primary)}
.pt td:nth-child(2),.pt td:nth-child(5){border-left:1px solid var(--border)}
.pt input{width:96px;height:30px;padding:0 8px;text-align:right;font-variant-numeric:tabular-nums}
.pt input.is-dirty{border-color:var(--primary);background:rgb(34 121 90 / .08)}
.pt .label{font-weight:600}
.pt .key{display:block;color:var(--muted);font-size:11px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="muted">加载中…</p></div>

<dialog id="ledger-dialog">
  <div class="row" style="justify-content:space-between;margin-bottom:12px"><h2 id="ledger-title" style="margin:0">余额记录</h2><button class="ghost small" type="button" onclick="this.closest('dialog').close()">关闭</button></div>
  <div class="table-box"><table><thead><tr><th>时间</th><th>说明</th><th class="num">变动</th><th class="num">余额</th></tr></thead><tbody id="ledger-body"></tbody></table></div>
</dialog>

<script>
(function () {
  "use strict";
  const app = document.getElementById("app");
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const money = (n) => "¥" + (Math.round(Number(n) * 1000) % 10 ? Number(n).toFixed(3) : Number(n).toFixed(2));
  const time = (t) => t ? new Date(t).toLocaleString("zh-CN", { hour12: false }) : "";
  const KIND = { redeem: "兑换码", admin: "管理员调整", usage: "生成消费", refund: "失败退款" };

  async function api(path, body, method) {
    const res = await fetch("/api/account" + path, {
      method: method || (body ? "POST" : "GET"),
      credentials: "same-origin",
      headers: body ? { "Content-Type": "application/json" } : undefined,
      body: body ? JSON.stringify(body) : undefined,
    });
    let data = {};
    try { data = await res.json(); } catch (_) {}
    if (!res.ok) throw new Error(data?.error?.message || "请求失败（" + res.status + "）");
    return data;
  }

  let me = null;
  let users = [];
  let codes = [];
  let lastBatch = null;
  let flash = { users: null, codes: null, channels: null, prices: null };
  let channels = [];
  let balances = null;
  let balancesLoading = false;
  let prices = [];
  let catalog = [];
  let cloud = { cloudName: "", apiKey: "", apiSecret: "" };
  let fx = 6.7;
  let markup = 2;
  const draft = new Map(); // "channel|model|spec" -> price string being edited

  function msg(m) { return m ? `<div class="msg ${m.err ? "err" : "ok"}" role="${m.err ? "alert" : "status"}">${esc(m.text)}</div>` : ""; }

  async function load() {
    me = (await api("/me")).user;
    if (!me || me.role !== "admin") {
      app.innerHTML = `<div class="gate card"><h1 style="justify-content:center"><img src="./kitty.png" alt="">管理后台</h1>
        <p class="muted">${me ? "当前账号没有管理员权限。" : "请先在老屋作坊首页登录管理员账号。"}</p>
        <p><a href="/">返回老屋作坊</a></p></div>`;
      return;
    }
    await Promise.all([loadStats(), loadUsers(), loadCodes(), loadChannels(), loadPrices(), loadCloud()]);
    render();
    checkBalances();
  }

  let statsData = null;
  async function loadStats() { statsData = await api("/admin/stats"); }
  async function loadUsers(q) { users = (await api("/admin/users" + (q ? "?q=" + encodeURIComponent(q) : ""))).items; }
  async function loadCodes() { codes = (await api("/admin/codes")).items; }
  async function loadCloud() { cloud = await api("/admin/cloudinary"); }
  async function loadChannels() { channels = (await api("/admin/channels")).items; }
  async function loadPrices() {
    const r = await api("/admin/price-catalog");
    catalog = r.rows; prices = r.prices; fx = r.fx;
  }
  const priceKey = (r) => `${r.channel}|${r.model}|${r.spec}`;
  const savedPrice = (r) => prices.find((p) => priceKey(p) === priceKey(r));
  async function checkBalances() {
    balancesLoading = true; render();
    try { balances = await api("/admin/channel-balances"); flash.channels = null; }
    catch (err) { flash.channels = { err: true, text: err.message }; }
    balancesLoading = false; render();
  }
  const fmtBal = (b, unit) => b == null ? "--" : b < 0 ? "无限" : unit + Number(b).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  const SITE_ORDER = ["tudou", "apimart", "runninghub", "grsai", "soon"];
  const SITE_NAME = { tudou: "Tudou", apimart: "Mart", runninghub: "RH", grsai: "Grsai", soon: "Soon" };

  function priceTables() {
    const costCell = (r) => r
      ? `<td class="num cost-col">${r.cost == null ? `<span class="muted">${esc(r.costText)}</span>` : money(r.cost)}${r.costText.startsWith("$") ? `<span class="key">${esc(r.costText)}</span>` : ""}</td>`
      : `<td class="num cost-col muted">—</td>`;
    const priceCell = (r) => {
      if (!r) return `<td class="muted">—</td>`;
      const key = priceKey(r);
      const saved = savedPrice(r);
      const value = draft.has(key) ? draft.get(key) : saved ? String(saved.price) : "";
      return `<td><input type="number" step="0.001" min="0" placeholder="客户价" aria-label="${esc(SITE_NAME[r.channel] + " " + r.label + " " + r.spec)} 客户价" data-price-key="${esc(key)}" value="${esc(value)}" class="${draft.has(key) ? "is-dirty" : ""}"></td>`;
    };
    return SITE_ORDER.map((ch) => {
      const rows = catalog.filter((r) => r.channel === ch);
      if (!rows.length) return "";
      const labels = [...new Set(rows.map((r) => r.label))];
      return `<div class="pt-group"><h3>${esc(SITE_NAME[ch])}</h3><div class="table-box"><table class="pt">
        <thead>
          <tr><th rowspan="2">模型</th><th colspan="3" class="cost-head">原价（元/张）</th><th colspan="3" class="price-head">客户价（元/张）</th></tr>
          <tr><th class="num">1K</th><th class="num">2K</th><th class="num">4K</th><th>1K</th><th>2K</th><th>4K</th></tr>
        </thead>
        <tbody>${labels.map((label) => {
          const items = rows.filter((r) => r.label === label);
          const single = items.length === 1 && !items[0].spec;
          const byRes = (res) => single ? (res === "1k" ? items[0] : null) : items.find((r) => r.spec.split("/")[0] === res);
          const res = ["1k", "2k", "4k"];
          return `<tr><td><span class="label">${esc(label)}</span><span class="key">${esc(items[0].model)}${single ? " · 不分分辨率" : ""}</span></td>
            ${res.map((x) => costCell(byRes(x))).join("")}${res.map((x) => priceCell(byRes(x))).join("")}</tr>`;
        }).join("")}</tbody></table></div></div>`;
    }).join("") + extraPrices();
  }

  // Prices saved earlier that are not in the built-in catalog.
  function extraPrices() {
    const known = new Set(catalog.map(priceKey));
    const extra = prices.filter((p) => !known.has(priceKey(p)));
    if (!extra.length) return "";
    return `<div class="pt-group"><h3>其他已保存的价格</h3><div class="table-box"><table>
      <thead><tr><th>渠道</th><th>模型</th><th>规格</th><th class="num">售价</th><th></th></tr></thead>
      <tbody>${extra.map((r) => `<tr><td>${esc(SITE_NAME[r.channel] || r.channel)}</td><td>${esc(r.model)}</td><td>${esc(r.spec)}</td><td class="num">${money(r.price)}</td>
        <td><button class="danger small" type="button" data-del-price="${r.id}">删除</button></td></tr>`).join("")}</tbody></table></div></div>`;
  }

  function render() {
    const s = statsData || {};
    const q = document.getElementById("user-q")?.value || "";
    app.innerHTML = `
      <header><h1><img src="./kitty.png" alt="">老屋作坊 · 管理后台</h1><span class="muted">${esc(me.username)} · <a href="/" style="color:inherit">返回首页</a></span></header>
      <div class="stats">
        <div class="stat"><span class="muted">用户数</span><b>${s.users ?? 0}</b></div>
        <div class="stat"><span class="muted">累计充值</span><b>${money(s.totalTopup ?? 0)}</b></div>
        <div class="stat"><span class="muted">累计消费</span><b>${money(s.totalUsage ?? 0)}</b></div>
        <div class="stat"><span class="muted">用户余额合计</span><b>${money(s.totalBalance ?? 0)}</b></div>
        <div class="stat"><span class="muted">未使用兑换码</span><b>${s.unusedCodes ?? 0}</b></div>
      </div>

      ${(() => {
        const low = (balances?.items || []).filter((b) => b.status === "low");
        return low.length ? `<div class="alert" role="alert">⚠ 该充值了：${low.map((b) => `${esc(b.name)}（剩 ${fmtBal(b.balance, b.unit)}，低于提醒线 ${b.unit}${b.alertThreshold}）`).join("；")}</div>` : "";
      })()}

      <section class="card">
        <div class="row" style="justify-content:space-between;margin-bottom:12px">
          <h2 style="margin:0">渠道余额</h2>
          <span class="row"><span class="muted" style="font-size:12px">${balances ? "上次查询 " + esc(time(balances.checkedAt)) : ""}</span>
          <button class="ghost small" type="button" id="check-balances" ${balancesLoading ? "disabled" : ""}>${balancesLoading ? "查询中…" : "刷新余额"}</button></span>
        </div>
        <div class="channels">${channels.map((c) => {
          const b = (balances?.items || []).find((x) => x.id === c.id);
          const status = !b ? (balancesLoading ? "查询中…" : "") : b.status === "ok" ? "正常" : b.status === "low" ? "该充值了" : b.status === "no_key" ? "未设置 Key" : "查询失败";
          const tag = !b ? "" : b.status === "ok" ? "ok" : b.status === "low" || b.status === "error" ? "off" : "";
          return `<div class="ch ${b?.status === "low" ? "is-low" : ""}">
            <div class="ch-head"><span class="ch-name">${esc(c.name)}${c.channelLabel ? ` <span class="ch-label">${esc(c.channelLabel)}</span>` : ""}</span>${status ? `<span class="tag ${tag}">${status}</span>` : ""}</div>
            <div class="ch-bal-row"><div class="ch-bal">${b && b.balance !== undefined ? fmtBal(b.balance, c.unit) : c.lastBalance != null ? fmtBal(c.lastBalance, c.unit) : "--"}</div>
              ${c.topupUrl ? `<a class="ch-topup" href="${esc(c.topupUrl)}" target="_blank" rel="noopener noreferrer">去充值 ↗</a>` : ""}</div>
            <div class="ch-sub">${esc(b?.detail || b?.message || (c.lastCheckedAt ? "上次 " + time(c.lastCheckedAt) : ""))}</div>
            <form data-channel="${c.id}">
              <label>API Key ${c.keySource === "env" ? "（由环境变量提供）" : ""}
                <input name="apiKey" type="password" autocomplete="off" placeholder="${c.hasKey ? "已设置 " + esc(c.keyPreview) + "，留空不修改" : "粘贴这个渠道的 API Key"}" ${c.keySource === "env" ? "disabled" : ""}></label>
              ${c.extraKey ? `<label>${esc(c.extraKey)}
                <input name="apiKey2" type="password" autocomplete="off" placeholder="${c.hasKey2 ? "已设置 " + esc(c.key2Preview) + "，留空不修改" : "没有可以不填"}"></label>` : ""}
              <div class="row"><label style="flex:1">余额低于多少提醒（${c.unit}）<input name="alertThreshold" type="number" step="0.01" min="0" value="${c.alertThreshold}"></label>
              <button class="small" type="submit" style="align-self:flex-end">保存</button></div>
            </form>
          </div>`;
        }).join("")}</div>
        ${msg(flash.channels)}
      </section>

      <section class="card">
        <h2>图床 Cloudinary <span class="muted" style="font-weight:400;font-size:13px">（管理员账号带参考图生成时用；普通用户在画布 设置 → 图床设置 里填自己的）</span></h2>
        <form class="row" id="cloud-form">
          <label class="muted" for="cl-name">Cloud Name</label><input id="cl-name" name="cloudName" value="${esc(cloud.cloudName)}" style="width:160px" autocomplete="off">
          <label class="muted" for="cl-key">API Key</label><input id="cl-key" name="apiKey" value="${esc(cloud.apiKey)}" style="width:180px" autocomplete="off">
          <label class="muted" for="cl-secret">API Secret</label><input id="cl-secret" name="apiSecret" type="password" placeholder="${cloud.apiSecret ? "已设置，留空不修改" : "粘贴 API Secret"}" style="width:200px" autocomplete="new-password">
          <button type="submit">保存</button>
          <a class="muted" href="https://console.cloudinary.com/settings/api-keys" target="_blank" rel="noopener" style="font-size:12px">在哪里找 ↗</a>
        </form>
        ${msg(flash.cloud)}
      </section>

      <section class="card">
        <h2>价格表 <span class="muted" style="font-weight:400;font-size:13px">（原价 = 上游成本；客户价 = 用户每张扣的钱，留空 = 不开放这个规格）</span></h2>
        <div class="pt-tools">
          <span class="muted">原价已按 1 美元 = ${fx} 元换算</span>
          <label class="muted" for="pt-markup">倍率</label>
          <input id="pt-markup" type="number" step="0.1" min="1" value="${markup}" style="width:80px">
          <button class="ghost" type="button" id="pt-fill">按 原价 × 倍率 填入空白客户价</button>
          <button type="button" id="pt-save">保存价格表${draft.size ? `（${draft.size} 处修改）` : ""}</button>
        </div>
        ${priceTables()}
        ${msg(flash.prices)}
      </section>

      <section class="card">
        <h2>用户</h2>
        <form class="row" id="search-form" style="margin-bottom:12px">
          <label for="user-q" class="muted">搜索</label>
          <input id="user-q" placeholder="邮箱或昵称" value="${esc(q)}">
          <button class="ghost" type="submit">搜索</button>
        </form>
        <div class="table-box"><table>
          <thead><tr><th>ID</th><th>昵称</th><th>邮箱</th><th>状态</th><th class="num">余额</th><th class="num">已消费</th><th>注册时间</th><th>调整余额（元，负数为扣减）</th><th></th></tr></thead>
          <tbody>${users.map((u) => `
            <tr>
              <td>${u.id}</td>
              <td>${u.customName ? esc(u.customName) : '<span class="muted">未设置</span>'}</td>
              <td>${esc(u.username)} ${u.role === "admin" ? '<span class="tag ok">管理员</span>' : ""}</td>
              <td>${u.disabled ? '<span class="tag off">已停用</span>' : '<span class="tag">正常</span>'}</td>
              <td class="num">${money(u.balance)}</td>
              <td class="num">${money(u.spent)}</td>
              <td>${esc(time(u.createdAt))}</td>
              <td><form class="row" data-adjust="${u.id}" style="flex-wrap:nowrap">
                <input name="amount" type="number" step="0.01" placeholder="如 50 或 -10" aria-label="给 ${esc(u.username)} 调整的金额" style="width:120px">
                <input name="note" placeholder="备注（可选）" aria-label="备注" style="width:120px">
                <button class="small" type="submit">确定</button>
              </form></td>
              <td class="row" style="flex-wrap:nowrap">
                <button class="ghost small" type="button" data-ledger="${u.id}" data-name="${esc(u.username)}">记录</button>
                ${u.balance > 0 ? `<button class="ghost small" type="button" data-zero="${u.id}">余额清零</button>` : ""}
                ${u.id === me.id ? "" : `<button class="${u.disabled ? "ghost" : "danger"} small" type="button" data-disable="${u.id}" data-to="${!u.disabled}">${u.disabled ? "启用" : "停用"}</button>`}
                ${u.id === me.id || u.role === "admin" ? "" : `<button class="danger small" type="button" data-delete-user="${u.id}">删除</button>`}
              </td>
            </tr>`).join("") || `<tr><td colspan="9" class="muted">没有用户</td></tr>`}</tbody>
        </table></div>
        ${msg(flash.users)}
      </section>

      <section class="card">
        <h2>生成兑换码</h2>
        <form class="row" id="codes-form">
          <label class="muted" for="c-amount">面额（元）</label><input id="c-amount" name="amountYuan" type="number" step="0.01" min="0.01" required style="width:110px" placeholder="如 20">
          <label class="muted" for="c-count">数量</label><input id="c-count" name="count" type="number" min="1" max="500" value="10" required style="width:90px">
          <label class="muted" for="c-batch">批次备注</label><input id="c-batch" name="batch" placeholder="如 16688-10月" style="width:160px">
          <button type="submit">生成</button>
        </form>
        ${lastBatch ? `<p class="muted" style="margin:12px 0 0">已生成 ${lastBatch.codes.length} 个 ${money(lastBatch.amount)} 兑换码（批次：${esc(lastBatch.batch)}），每行一个，可直接复制到卡密平台：</p>
          <textarea readonly id="new-codes" aria-label="新生成的兑换码">${esc(lastBatch.codes.join("\n"))}</textarea>
          <div class="row" style="margin-top:8px"><button class="ghost" type="button" id="copy-codes">复制全部</button><button class="ghost" type="button" id="dl-codes">下载 CSV</button></div>` : ""}
        ${msg(flash.codes)}
      </section>

      <section class="card">
        <h2>兑换码记录 <span class="muted" style="font-weight:400;font-size:13px">（最近 200 个）</span></h2>
        <div class="table-box"><table>
          <thead><tr><th>兑换码</th><th class="num">面额</th><th>批次</th><th>状态</th><th>使用者</th><th>生成时间</th></tr></thead>
          <tbody>${codes.map((c) => `<tr>
            <td><code>${esc(c.code)}</code></td><td class="num">${money(c.amount)}</td><td>${esc(c.batch)}</td>
            <td>${c.usedAt ? '<span class="tag">已使用</span>' : '<span class="tag ok">未使用</span>'}</td>
            <td>${esc(c.usedBy || "")}${c.usedAt ? ` <span class="muted">${esc(time(c.usedAt))}</span>` : ""}</td>
            <td>${esc(time(c.createdAt))}</td></tr>`).join("") || `<tr><td colspan="6" class="muted">还没有兑换码</td></tr>`}</tbody>
        </table></div>
      </section>`;
  }

  app.addEventListener("submit", async (e) => {
    const form = e.target;
    e.preventDefault();
    try {
      if (form.id === "search-form") {
        await loadUsers(form.querySelector("#user-q").value.trim());
        flash.users = null;
      } else if (form.dataset.adjust) {
        const amount = form.amount.value.trim();
        if (!amount || Number(amount) === 0) throw new Error("请输入金额");
        const u = users.find((x) => x.id === Number(form.dataset.adjust));
        if (!confirm(`确认给 ${u.username} ${Number(amount) > 0 ? "充值" : "扣减"} ${money(Math.abs(Number(amount)))}？`)) return;
        const r = await api("/admin/balance", { userId: u.id, amountYuan: amount, note: form.note.value.trim() });
        flash.users = { text: `${u.username} 当前余额 ${money(r.balance)}` };
        await Promise.all([loadUsers(document.getElementById("user-q").value.trim()), loadStats()]);
      } else if (form.dataset.channel) {
        const data = Object.fromEntries(new FormData(form).entries());
        const body = { id: form.dataset.channel, alertThreshold: data.alertThreshold };
        if (data.apiKey) body.apiKey = data.apiKey;
        if (data.apiKey2) body.apiKey2 = data.apiKey2;
        await api("/admin/channels", body);
        flash.channels = { text: "已保存" };
        await loadChannels();
        checkBalances();

      } else if (form.id === "cloud-form") {
        const data = Object.fromEntries(new FormData(form).entries());
        cloud = await api("/admin/cloudinary", data);
        flash.cloud = { text: "已保存，管理员账号刷新画布后生效" };
      } else if (form.id === "codes-form") {
        const data = Object.fromEntries(new FormData(form).entries());
        lastBatch = await api("/admin/codes", data);
        flash.codes = { text: "生成成功" };
        await Promise.all([loadCodes(), loadStats()]);
      }
    } catch (err) {
      if (form.id === "codes-form") flash.codes = { err: true, text: err.message };
      else if (form.id === "cloud-form") flash.cloud = { err: true, text: err.message };
      else if (form.dataset.channel) flash.channels = { err: true, text: err.message };
      else flash.users = { err: true, text: err.message };
    }
    render();
  });

  app.addEventListener("input", (e) => {
    const input = e.target.closest("[data-price-key]");
    if (!input) return;
    const key = input.dataset.priceKey;
    const r = catalog.find((x) => priceKey(x) === key);
    const saved = r && savedPrice(r);
    if ((saved ? String(saved.price) : "") === input.value.trim()) draft.delete(key);
    else draft.set(key, input.value);
    input.classList.toggle("is-dirty", draft.has(key));
    const save = document.getElementById("pt-save");
    if (save) save.textContent = "保存价格表" + (draft.size ? `（${draft.size} 处修改）` : "");
  });

  app.addEventListener("click", async (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    try {
      if (b.id === "check-balances") { checkBalances(); return; }
      if (b.id === "pt-fill") {
        markup = Number(document.getElementById("pt-markup").value) || markup;
        let n = 0;
        for (const r of catalog) {
          const key = priceKey(r);
          if (r.cost == null || savedPrice(r) || (draft.get(key) ?? "") !== "") continue;
          draft.set(key, String(Math.ceil(r.cost * markup * 100) / 100));
          n++;
        }
        flash.prices = { text: n ? `已填入 ${n} 个客户价（按量计费的规格没有原价，需要手动填），确认后点"保存价格表"` : "没有需要填的空白客户价" };
        render(); return;
      }
      if (b.id === "pt-save") {
        if (!draft.size) { flash.prices = { text: "没有修改" }; render(); return; }
        const items = [...draft.entries()].map(([key, price]) => {
          const [channel, model, spec] = key.split("|");
          const r = catalog.find((x) => priceKey(x) === key);
          return { channel, model, spec, price: price.trim(), cost: r?.costText || "", note: r?.label || "" };
        });
        await api("/admin/prices/bulk", { items });
        draft.clear();
        await loadPrices();
        flash.prices = { text: `已保存 ${items.length} 处修改` };
        render(); return;
      }
      if (b.dataset.delPrice) {
        const r = prices.find((x) => x.id === Number(b.dataset.delPrice));
        if (!confirm(`删除 ${r.model} ${r.spec} 的价格？`)) return;
        await api("/admin/prices/delete", { id: r.id });
        await loadPrices(); render(); return;
      }
      if (b.dataset.ledger) {
        const items = (await api("/admin/user-ledger?userId=" + b.dataset.ledger)).items;
        document.getElementById("ledger-title").textContent = b.dataset.name + " 的余额记录";
        document.getElementById("ledger-body").innerHTML = items.map((i) => `<tr><td>${esc(time(i.createdAt))}</td><td>${esc(i.note || KIND[i.kind] || i.kind)}</td><td class="num">${i.amount > 0 ? "+" : ""}${money(i.amount).replace("¥-", "-¥")}</td><td class="num">${money(i.balanceAfter)}</td></tr>`).join("") || `<tr><td colspan="4" class="muted">没有记录</td></tr>`;
        document.getElementById("ledger-dialog").showModal();
      } else if (b.dataset.disable) {
        const to = b.dataset.to === "true";
        if (to && !confirm("停用后该用户会被立即退出且无法登录，确认？")) return;
        await api("/admin/disable", { userId: Number(b.dataset.disable), disabled: to });
        await loadUsers(document.getElementById("user-q").value.trim());
        render();
      } else if (b.dataset.zero) {
        const u = users.find((x) => x.id === Number(b.dataset.zero));
        if (!confirm(`把 ${u.username} 的余额 ${money(u.balance)} 清零？会记入余额记录。`)) return;
        const r = await api("/admin/balance", { userId: u.id, amountYuan: -u.balance, note: "管理员清零" });
        flash.users = { text: `${u.username} 余额已清零（当前 ${money(r.balance)}）` };
        await Promise.all([loadUsers(document.getElementById("user-q").value.trim()), loadStats()]);
        render();
      } else if (b.dataset.deleteUser) {
        const u = users.find((x) => x.id === Number(b.dataset.deleteUser));
        if (!confirm(`永久删除 ${u.username}？该账号的登录和余额记录会一起删除，无法恢复。`)) return;
        await api("/admin/delete-user", { userId: u.id });
        flash.users = { text: `已删除 ${u.username}` };
        await Promise.all([loadUsers(document.getElementById("user-q").value.trim()), loadStats()]);
        render();
      } else if (b.id === "copy-codes") {
        await navigator.clipboard.writeText(lastBatch.codes.join("\n"));
        b.textContent = "已复制";
      } else if (b.id === "dl-codes") {
        const csv = "兑换码,面额,批次\n" + lastBatch.codes.map((c) => `${c},${lastBatch.amount},${lastBatch.batch}`).join("\n");
        const a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv" }));
        a.download = `兑换码-${lastBatch.amount}元-${lastBatch.codes.length}个.csv`;
        a.click();
      }
    } catch (err) {
      if (b.id && b.id.startsWith("pt-") || b.dataset.delPrice) flash.prices = { err: true, text: err.message };
      else flash.users = { err: true, text: err.message };
      render();
    }
  });

  load().catch((err) => { app.innerHTML = `<div class="gate card"><p class="msg err">${esc(err.message)}</p></div>`; });
})();
</script>
</body>
</html>
