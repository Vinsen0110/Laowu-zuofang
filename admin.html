  // ---------- quick jump (⌘K) ----------
  const cmdk = document.getElementById("cmdk");
  const cmdkInput = document.getElementById("cmdk-input");
  const cmdkList = document.getElementById("cmdk-list");
  let cmdkItems = [];
  let cmdkSel = 0;
  function go(id, focusId) {
    if (cmdk.open) cmdk.close();
    tab = id; drawerUser = null;
    history.replaceState(null, "", "#" + id);
    render();
    window.scrollTo(0, 0);
    if (focusId) document.getElementById(focusId)?.focus();
  }
  function cmdkBuild(q) {
    const t = q.trim().toLowerCase();
    const items = [];
    TABS.forEach((id) => items.push({ g: "页面", icon: ICON[id], label: TAB_LABEL[id], run: () => go(id) }));
    items.push({ g: "操作", icon: ICON.refresh, label: "刷新渠道余额", run: () => { go("overview"); checkBalances({ announce: true }); } });
    items.push({ g: "操作", icon: ICON.wallet, label: "给用户充值", run: () => go("overview", "qa-who") });
    items.push({ g: "操作", icon: ICON.plus, label: "生成兑换码", run: () => go("codes", "c-amount") });
    allUsers.forEach((u) => items.push({ g: "用户", avatar: avatarOf(u), label: displayName(u), hint: u.username, run: () => { go("users"); openUser(u.id); } }));
    return items.filter((i) => !t || (i.label + " " + (i.hint || "")).toLowerCase().includes(t)).slice(0, 30);
  }
  function cmdkDraw() {
    let last = "";
    cmdkList.innerHTML = cmdkItems.map((it, n) => {
      const header = it.g !== last ? `<li class="cmdk-group" role="presentation">${it.g}</li>` : "";
      last = it.g;
      return `${header}<li role="presentation"><button type="button" class="cmdk-item ${n === cmdkSel ? "is-on" : ""}" role="option" aria-selected="${n === cmdkSel}" data-i="${n}">${it.avatar ? `<img src="${esc(it.avatar)}" alt="">` : it.icon}<span>${esc(it.label)}</span>${it.hint ? `<small>${esc(it.hint)}</small>` : ""}</button></li>`;
    }).join("") || `<li class="empty" style="padding:28px 0">没有找到匹配的内容</li>`;
    cmdkList.querySelector(".is-on")?.scrollIntoView({ block: "nearest" });
  }
  function openCmdk() {
    if (cmdk.open) return;
    cmdkInput.value = "";
    cmdkItems = cmdkBuild(""); cmdkSel = 0; cmdkDraw();
    cmdk.showModal();
    cmdkInput.focus();
  }
  cmdkInput.addEventListener("input", () => { cmdkItems = cmdkBuild(cmdkInput.value); cmdkSel = 0; cmdkDraw(); });
  cmdkInput.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      if (!cmdkItems.length) return;
      cmdkSel = (cmdkSel + (e.key === "ArrowDown" ? 1 : -1) + cmdkItems.length) % cmdkItems.length;
      cmdkDraw();
    } else if (e.key === "Enter") {
      e.preventDefault();
      cmdkItems[cmdkSel]?.run();
    }
  });
  cmdkList.addEventListener("click", (e) => {
    const b = e.target.closest("[data-i]");
    if (b) cmdkItems[Number(b.dataset.i)]?.run();
  });
  cmdk.addEventListener("click", (e) => { if (e.target === cmdk) cmdk.close(); });

  // ---------- events ----------
  document.addEventListener("submit", async (e) => {
    const form = e.target;
    if (form.method === "dialog" || !form.closest("#app, #ch-dialog")) return;
    e.preventDefault();
    const btn = e.submitter || form.querySelector('[type="submit"]');
    busy(btn, true);
    try {
      if (form.id === "qa-topup") {
        const u = findUser(form.who.value);
        const amount = form.amount.value.trim();
        if (!u) throw new Error(form.who.value.trim() ? "找不到这个用户，请从下拉列表里选" : "请先输入要充值的用户");
        if (!amount || Number(amount) === 0) throw new Error("请输入充值金额");
        const up = Number(amount) > 0;
        if (!await ask({ title: `${up ? "充值" : "扣减"} ${money(Math.abs(Number(amount)))}`, text: `给 ${u.username}${up ? "充值" : "扣减"} ${money(Math.abs(Number(amount)))}，调整后余额 ${money(u.balance + Number(amount))}。`, ok: up ? "确认充值" : "确认扣减", danger: !up })) return;
        const r = await api("/admin/balance", { userId: u.id, amountYuan: amount, note: "" });
        toast(`${u.username} 当前余额 ${money(r.balance)}`);
        qa.amount = "";
        await Promise.all([refreshUsers(), loadStats()]);
      } else if (form.id === "qa-codes") {
        lastBatch = await api("/admin/codes", { amountYuan: form.amountYuan.value, count: form.count.value, batch: "" });
        toast(`已生成 ${lastBatch.codes.length} 个兑换码`);
        qa.codeAmount = "";
        await Promise.all([loadCodes(), loadStats()]);
      } else if (form.dataset.adjust) {
        const u = userById(Number(form.dataset.adjust));
        const amount = form.amount.value.trim();
        if (!amount || Number(amount) === 0) throw new Error("请输入调整金额，比如 50 或 -10");
        const up = Number(amount) > 0;
        if (!await ask({ title: `${up ? "充值" : "扣减"} ${money(Math.abs(Number(amount)))}`, text: `给 ${u.username}${up ? "充值" : "扣减"} ${money(Math.abs(Number(amount)))}，调整后余额 ${money(u.balance + Number(amount))}。`, ok: up ? "确认充值" : "确认扣减", danger: !up })) return;
        const r = await api("/admin/balance", { userId: u.id, amountYuan: amount, note: form.note.value.trim() });
        toast(`${u.username} 当前余额 ${money(r.balance)}`);
        adj.amount = ""; adj.note = "";
        await Promise.all([refreshUsers(), loadStats()]);
        loadLedger(u.id);
      } else if (form.dataset.channel) {
        const data = Object.fromEntries(new FormData(form).entries());
        const body = { id: form.dataset.channel, alertThreshold: data.alertThreshold };
        if (data.apiKey) body.apiKey = data.apiKey;
        if (data.apiKey2) body.apiKey2 = data.apiKey2;
        await api("/admin/channels", body);
        chDialog.close();
        toast(`${chName(form.dataset.channel)} 已保存`);
        await loadChannels();
        checkBalances();
      } else if (form.id === "mail-form") {
        const key = new FormData(form).get("apiKey");
        if (!key) throw new Error("请粘贴 Resend API Key");
        mail = await api("/admin/mail", { apiKey: key });
        toast("已保存，之后的验证码会通过邮件发送");
      } else if (form.id === "delivery-form") {
        const delivery = new FormData(form).get("delivery") === "direct" ? "direct" : "cos";
        cos = await api("/admin/cos", { delivery });
        toast(delivery === "direct" ? "已切换为直连平台，之后的生成立即生效" : "已切换为腾讯云 COS，之后的生成立即生效");
      } else if (form.id === "cos-form") {
        cos = await api("/admin/cos", Object.fromEntries(new FormData(form).entries()));
        toast(cos.ready ? "已保存，点“测试上传”确认能用" : "已保存，还差几项没填");
      } else if (form.id === "cloud-form") {
        cloud = await api("/admin/cloudinary", Object.fromEntries(new FormData(form).entries()));
        toast("已保存，管理员账号刷新画布后生效");
      } else if (form.id === "codes-form") {
        lastBatch = await api("/admin/codes", Object.fromEntries(new FormData(form).entries()));
        codeDraft.amountYuan = ""; codeDraft.count = "10"; codeDraft.batch = "";
        toast(`已生成 ${lastBatch.codes.length} 个兑换码`);
        await Promise.all([loadCodes(), loadStats()]);
      }
    } catch (err) {
      toast(err.message, true);
    } finally {
      busy(btn, false);
    }
    render();
  });

  document.addEventListener("input", (e) => {
    const t = e.target;
    if (t.id === "user-q") {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(async () => {
        const seq = ++searchSeq;
        const q = t.value.trim();
        let found;
        try { found = (await api("/admin/users" + (q ? "?q=" + encodeURIComponent(q) : ""))).items; }
        catch (err) { toast(err.message, true); return; }
        if (seq !== searchSeq) return; // a newer search is already on its way
        userQ = q; users = found;
        render();
      }, 260);
      return;
    }
    if (t.id === "pt-filter") { ptFilter = t.value; applyPriceFilter(); return; }
    if (t.id === "qa-who" || t.id === "qa-amount") {
      qa[t.name === "who" ? "who" : "amount"] = t.value;
      document.getElementById("qa-hint").innerHTML = qaHint();
      return;
    }
    if (t.id === "qa-camount") { qa.codeAmount = t.value; return; }
    if (t.id === "qa-ccount") { qa.codeCount = t.value; return; }
    if (t.id === "c-amount" || t.id === "c-count" || t.id === "c-batch") {
      codeDraft[t.name] = t.value;
      document.getElementById("c-total").textContent = codeTotal();
      document.getElementById("c-sub").textContent = codeSub();
      document.querySelectorAll("[data-c-amount]").forEach((c) => c.classList.toggle("is-on", Number(c.dataset.cAmount) === Number(codeDraft.amountYuan)));
      return;
    }
    if (t.id === "dr-amount" || t.id === "dr-note") {
      adj[t.name] = t.value;
      const u = userById(drawerUser);
      const out = document.getElementById("dr-preview");
      if (u && out) { const p = adjustPreview(u); out.className = p.cls; out.innerHTML = p.html; }
      return;
    }
    const input = t.closest?.("[data-price-key]");
    if (!input) return;
    const key = input.dataset.priceKey;
    const r = catalog.find((x) => priceKey(x) === key);
    const saved = r && savedPrice(r);
    if ((saved ? String(saved.price) : "") === input.value.trim()) draft.delete(key);
    else draft.set(key, input.value);
    input.classList.toggle("is-dirty", draft.has(key));
    input.title = draft.has(key) ? (saved ? `原来 ${money(saved.price)}` : "原来未开放") : "";
    const ratio = document.querySelector(`[data-ratio="${CSS.escape(key)}"]`);
    if (ratio && r) ratio.innerHTML = ratioHtml(r, input.value);
    syncSavebar();
  });

  document.addEventListener("keydown", (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k" && me?.role === "admin") {
      e.preventDefault();
      if (cmdk.open) cmdk.close(); else if (!document.querySelector("dialog[open]")) openCmdk();
      return;
    }
    if (e.key === "Escape" && drawerUser != null && !document.querySelector("dialog[open]")) { closeDrawer(); return; }
    if (e.key === "Enter" && e.target.matches?.("tr[data-open-user]")) { e.preventDefault(); openUser(Number(e.target.dataset.openUser)); return; }
    // Enter in a price box moves to the next one, like a spreadsheet.
    if (e.key === "Enter" && e.target.matches?.("[data-price-key]")) {
      e.preventDefault();
      const all = [...document.querySelectorAll("[data-price-key]")].filter((el) => el.offsetParent !== null);
      const next = all[all.indexOf(e.target) + (e.shiftKey ? -1 : 1)];
      if (next) { next.focus(); next.select(); }
    }
  });

  // Highlight the row and column of the price being edited.
  document.addEventListener("focusin", (e) => {
    const table = document.querySelector(".mx");
    if (!table) return;
    table.querySelectorAll(".is-focus").forEach((el) => el.classList.remove("is-focus"));
    const input = e.target.closest?.("[data-price-key]");
    if (!input) return;
    const td = input.closest("td");
    const col = td.dataset.col;
    td.closest("tr").classList.add("is-focus");
    table.querySelector(`th[data-col="${col}"]`)?.classList.add("is-focus");
    table.querySelector(`th[data-colgroup="${col.split("-")[0]}"]`)?.classList.add("is-focus");
  });

  document.addEventListener("click", async (e) => {
    if (e.target.closest("[data-close-drawer]")) { closeDrawer(); return; }
    const opener = e.target.closest("[data-open-user]");
    if (opener) { openUser(Number(opener.dataset.openUser)); return; }
    const b = e.target.closest("button");
    if (!b || !b.closest("#app, #ch-dialog")) return;
    try {
      if (b.id === "open-cmdk") { openCmdk(); return; }
      if (b.dataset.closeDialog != null) { b.closest("dialog").close(); return; }
      if (b.dataset.reveal) {
        const input = b.parentElement.querySelector("input");
        if (input.type === "password") {
          if (!input.value && !input.disabled) {
            const r = await api(`/admin/secret?item=${encodeURIComponent(b.dataset.reveal)}`);
            if (r.value) input.value = r.value;
          }
          input.type = "text";
          b.innerHTML = ICON.eyeOff;
          b.setAttribute("aria-label", "隐藏密钥");
        } else {
          input.type = "password";
          b.innerHTML = ICON.eye;
          b.setAttribute("aria-label", "显示密钥");
        }
        return;
      }
      if (b.dataset.chSettings) { openChannelDialog(b.dataset.chSettings); return; }
      if (b.dataset.qaAmount) {
        qa.amount = b.dataset.qaAmount;
        const input = document.getElementById("qa-amount");
        input.value = qa.amount;
        document.getElementById("qa-hint").innerHTML = qaHint();
        input.focus();
        return;
      }
      if (b.dataset.quick) {
        adj.amount = b.dataset.quick;
        const input = document.getElementById("dr-amount");
        input.value = adj.amount;
        input.dispatchEvent(new Event("input", { bubbles: true }));
        input.focus();
        return;
      }
      if (b.dataset.cAmount) {
        const input = document.getElementById("c-amount");
        input.value = b.dataset.cAmount;
        input.dispatchEvent(new Event("input", { bubbles: true }));
        return;
      }
      if (b.dataset.step) {
        const input = document.getElementById("c-count");
        input.value = Math.max(1, Math.min(500, (Number(input.value) || 0) + Number(b.dataset.step)));
        input.dispatchEvent(new Event("input", { bubbles: true }));
        return;
      }
      if (b.dataset.userFilter) { userFilter = b.dataset.userFilter; render(); return; }
      if (b.dataset.codeFilter) { codeFilter = b.dataset.codeFilter; render(); return; }
      if (b.dataset.family) {
        ptFamily = b.dataset.family;
        document.querySelectorAll("[data-family]").forEach((x) => { if (x.tagName === "BUTTON") { x.classList.toggle("is-on", x === b); x.setAttribute("aria-pressed", String(x === b)); } });
        applyPriceFilter();
        return;
      }
      if (b.dataset.copy) {
        await navigator.clipboard.writeText(b.dataset.copy);
        toast(`已复制 ${b.dataset.copy}`);
        return;
      }
      if (b.id === "check-balances") { checkBalances({ announce: true }); return; }
      if (b.id === "pt-fill") {
        markup = Number(document.getElementById("pt-markup").value) || markup;
        let n = 0;
        for (const r of catalog) {
          const key = priceKey(r);
          if (r.cost == null || savedPrice(r) || (draft.get(key) ?? "") !== "") continue;
          draft.set(key, String(Math.ceil(r.cost * markup * 100) / 100));
          n++;
        }
        toast(n ? `已按成本的 ${markup} 倍填好 ${n} 个空白格，确认后点“保存价格表”` : "没有需要填的空白格");
        render(); return;
      }
      if (b.id === "pt-discard") {
        if (!await ask({ title: "放弃修改", text: `放弃这 ${draft.size} 处还没保存的价格？`, ok: "放弃修改", danger: true })) return;
        draft.clear();
        toast("已放弃修改");
        render(); return;
      }
      if (b.id === "pt-save") {
        if (!draft.size) { toast("没有修改"); return; }
        const items = [...draft.entries()].map(([key, price]) => {
          const [channel, model, spec] = key.split("|");
          const r = catalog.find((x) => priceKey(x) === key);
          return { channel, model, spec, price: price.trim(), cost: r?.costText || "", note: r?.label || "" };
        });
        busy(b, true);
        try { await api("/admin/prices/bulk", { items }); } finally { busy(b, false); }
        draft.clear();

        toast(`已保存 ${items.length} 处价格`);

        await api("/admin/prices/delete", { id: r.id });
        await loadPrices(); toast("已删除价格"); render(); return;
      }
      if (b.dataset.disable) {
        const to = b.dataset.to === "true";

        toast(`已重新编号 ${r.users} 个用户`);
        await Promise.all([refreshUsers(), loadStats()]);
        render();
      } else if (b.dataset.zero) {
        const u = userById(Number(b.dataset.zero));

        busy(b, true);
        const r = await api("/admin/balance", { userId: u.id, amountYuan: -u.balance, note: "管理员清零" });
        toast(`${u.username} 余额已清零（当前 ${money(r.balance)}）`);

        loadLedger(u.id);
        render();
      } else if (b.dataset.deleteUser) {

        busy(b, true);
        await api("/admin/delete-user", { userId: u.id });
        drawerUser = null;

        await Promise.all([refreshUsers(), loadStats()]);
        render();

            ? `删除已使用的兑换码 ${c.code}（${money(c.amount)}）？只删除这条记录，用户已到账的余额和余额记录不受影响。`
            : `删除兑换码 ${c.code}（${money(c.amount)}）？删除后这个码就不能再兑换了。`,
          ok: "删除", danger: true,

        render();

        try {

          toast("测试成功：能上传，也能从公开链接读取");
        } finally { busy(b, false); }
      } else if (b.id === "copy-codes") {

      }

      busy(b, false);
      toast(err.message, true);
    }
  });

  window.addEventListener("hashchange", () => {
    const next = location.hash.slice(1);
    if (TABS.includes(next) && next !== tab) {
      tab = next;
      drawerUser = null;
      render();
      window.scrollTo(0, 0);
    }
  });

  load().catch((err) => { app.innerHTML = `<div class="gate panel"><p style="color:var(--bad)">${esc(err.message)}</p><p><a href="/">返回老屋作坊</a></p></div>`; });
})();
</script>
</body>
</html>
